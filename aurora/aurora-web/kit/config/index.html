<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aurora · Beyond Company</title>
    <meta name="description" content="A AURORA organiza capacidades da Beyond e de sua rede ao redor de oportunidades para que founders possam testar o que importa." />
    <!-- Favicon (29/set): SVG que acompanha o tema do navegador; .ico e PNG para Safari/iOS. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#101011" />
    <meta name="robots" content="%VITE_ROBOTS%" />
    <!-- Compartilhamento (29/set): versão clara escolhida pelo usuário (Figma 704:283), 1200×630.
         As redes exigem endereço absoluto: vem de VITE_SITE_URL (.env). -->
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="pt_BR" />
    <meta property="og:site_name" content="Aurora · Beyond Company" />
    <meta property="og:url" content="%VITE_SITE_URL%/" />
    <meta property="og:title" content="Aurora · Beyond Company" />
    <meta property="og:description" content="A AURORA organiza capacidades da Beyond e de sua rede ao redor de oportunidades para que founders possam testar o que importa." />
    <meta property="og:image" content="%VITE_SITE_URL%/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="aurora. — Sua ideia funciona fora do deck?" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="%VITE_SITE_URL%/" />
    <link rel="preload" href="/fonts/britti-sans-regular.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/britti-sans-medium.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/britti-sans.css" />
    <!-- Loading em quadrados (30/set, referência: legencymedia.com). A cortina laranja já está
         na primeira pintura, antes do JS; src/loader.ts a desfaz em quadrados. Sem JS ou com
         movimento reduzido, ela não aparece. -->
    <style>
      #au-loader { position: fixed; inset: 0; z-index: 9999; background: #FA6E30; pointer-events: none; }
      #au-loader canvas { display: block; width: 100%; height: 100%; }
      @media (prefers-reduced-motion: reduce) { #au-loader { display: none; } }
    </style>
    <noscript><style>#au-loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="au-loader" aria-hidden="true"></div>
    <script>
      // Trava: se o app não subir (erro de JS), a cortina não fica fechada — some em 4s.
      setTimeout(function () {
        var l = document.getElementById("au-loader");
        if (l && !l.querySelector("canvas")) l.style.display = "none";
      }, 4000);
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
